# A local observability stack for the telemetry examples.
#
#   Browser editors --OTLP/HTTP--> OpenTelemetry collector --> Prometheus --> Grafana
#                                                           \-> Jaeger (traces)
#   Collaboration server /metrics --------------------------> Prometheus
#
# Grafana: http://localhost:3300 (no sign-in). Jaeger: http://localhost:16686.
# The dashboards come from assets/observability, the files you import.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ['--config=/etc/otel-collector.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - '4318:4318' # OTLP over HTTP, from the browser
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-otlp-receiver'
      - '--enable-feature=created-timestamp-zero-ingestion'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    extra_hosts:
      - 'host.docker.internal:host-gateway' # the collaboration server runs on the host

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    ports:
      - '16686:16686'

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../assets/observability/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - '${GRAFANA_PORT:-3300}:3000'
    depends_on:
      - prometheus
