global:
  scrape_interval: 5s
  evaluation_interval: 30s

# Alerts on clear faults, from assets/observability/prometheus/rules.yml.
rule_files:
  - /etc/prometheus/rules.yml

# Editor metrics arrive over OTLP from the collector: `service.name` becomes `job`.
otlp:
  promote_resource_attributes: []

scrape_configs:
  # Room metrics from examples/telemetry-collaboration/server, running on the host.
  - job_name: collaboration-server
    static_configs:
      - targets: ['host.docker.internal:1235']
