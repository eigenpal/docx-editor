<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOCX Editor — React Demo</title>
  <meta name="description" content="Try the React DOCX editor in your browser. Edit Word documents with tables, images, tracked changes, and comments. No server required.">

  <!-- Icons and the og share image mirror the docx-editor.dev site, so the demo
       and a shared link use the same artwork. The manifest-sized PNGs are
       declared as icons only; no demo ships a webmanifest. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png">
  <link rel="canonical" href="https://latest.docx-editor.dev/react/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DOCX Editor">
  <meta property="og:title" content="DOCX Editor — React Demo">
  <meta property="og:description" content="Try the React DOCX editor in your browser. Edit Word documents with tables, images, tracked changes, and comments. No server required.">
  <meta property="og:url" content="https://latest.docx-editor.dev/react/">
  <meta property="og:image" content="https://latest.docx-editor.dev/react/og/docx-icon.png?v=2">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="312">
  <meta property="og:image:height" content="400">
  <meta property="og:image:alt" content="DOCX document icon">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DOCX Editor — React Demo">
  <meta name="twitter:description" content="Try the React DOCX editor in your browser. Edit Word documents with tables, images, tracked changes, and comments. No server required.">
  <meta name="twitter:image" content="https://latest.docx-editor.dev/react/og/docx-icon.png?v=2">
  <meta name="twitter:image:alt" content="DOCX document icon">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    #app {
      width: 100%;
      min-height: 100vh;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #94a3b8;
      gap: 16px;
      font-size: 14px;
    }
    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">
      <div class="loading-spinner"></div>
      <span>Loading editor...</span>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
