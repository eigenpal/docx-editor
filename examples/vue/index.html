<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docx-editor-vue — Vue Example</title>

  <!-- Icons and the og share image mirror the docx-editor.dev site, so the demo
       and a shared link use the same artwork. The manifest-sized PNGs are
       declared as icons only; no demo ships a webmanifest. -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/web-app-manifest-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/web-app-manifest-512x512.png">
  <link rel="canonical" href="https://docx-editor.dev/">

  <meta property="og:title" content="DOCX Editor — Open-source DOCX editor for the browser">
  <meta property="og:description" content="WYSIWYG DOCX editor in the browser. Tables, images, tracked changes, comments. No server required. Open source.">
  <meta property="og:url" content="https://docx-editor.dev/">
  <meta property="og:image" content="/og/docx-icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="/og/docx-icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    /* A DEFINITE height, not min-height: the harness root uses `height: 100%`,
       which cannot resolve against a min-height-only parent and so collapsed to
       content height. Independent review measured the consequence: the Vue viewport
       reported clientHeight === scrollHeight, an assigned scrollTop did not stick,
       and therefore the input-host scroll path never fired, drag autoscroll was a
       silent no-op, and the scroll leg of the paired parity gate passed without
       exercising anything. React's harness already gets a definite height from its
       `height: 100vh` wrapper. */
    #app { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
