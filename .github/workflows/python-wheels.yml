name: Python wheels

# Builds the docx-to-markdown Python package: one platform-tagged wheel per runner,
# each carrying a Bun executable compiled on that platform. Pull requests that touch
# the Python package upload the wheels as artifacts; engine changes are covered by the
# main CI and do not rebuild wheels. The release workflow dispatches this one at the
# release tag with `publish` set, which uploads to PyPI through trusted publishing
# (the `pypi` environment; no token is stored).

on:
  pull_request:
    paths:
      - 'python/docx-to-markdown/**'
      - '.github/workflows/python-wheels.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload the wheels to PyPI'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            tag: linux-x64
          - os: ubuntu-24.04-arm
            tag: linux-arm64
          - os: macos-15
            tag: macos-arm64
          - os: macos-15-intel
            tag: macos-x64
          - os: windows-2025
            tag: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - name: Build the packages the runtime bundles
        # Only the converter's own dependency chain; the DTS build of core needs the
        # same heap as the main CI build job.
        run: >-
          bun run --filter '@docx-editor.dev/i18n' build &&
          bun run --filter '@docx-editor.dev/core' build &&
          bun run --filter '@docx-editor.dev/fonts' build &&
          bun run --filter '@docx-editor.dev/docx-to-markdown' build
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
      - name: Typecheck runtime
        working-directory: python/docx-to-markdown
        run: bun run typecheck:runtime
      - name: Build runtime
        working-directory: python/docx-to-markdown
        run: bun run build:runtime
      - name: Lint and type-check
        working-directory: python/docx-to-markdown
        # bash on every runner: PowerShell would not stop at the first failing command.
        shell: bash
        run: |
          uvx ruff check src tests hatch_build.py
          uvx ruff format --check src tests hatch_build.py
          uv run --python 3.11 --no-project --with pyright --with-editable . pyright
      - name: Test
        working-directory: python/docx-to-markdown
        run: uv run --python 3.11 --no-project --with pytest --with-editable . pytest -q
      - name: Build wheel
        working-directory: python/docx-to-markdown
        run: uv build --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.tag }}
          path: python/docx-to-markdown/dist/*.whl
          if-no-files-found: error

  publish:
    # Runs even when a platform build failed, so the wheels that did build still ship.
    # The Slack message names any platform that is missing.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && needs.wheel.result != 'cancelled'
    needs: wheel
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Take stock of the wheels
        id: stock
        run: |
          ls -la dist || true
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "No wheel was built; nothing to publish." >&2
            exit 1
          fi
          version=$(basename "${wheels[0]}" | sed -E 's/docx_to_markdown-([^-]+)-.*/\1/')
          missing=""
          for tag in manylinux_2_17_x86_64 manylinux_2_17_aarch64 macosx_13_0_arm64 macosx_13_0_x86_64 win_amd64; do
            ls dist/*-py3-none-"$tag".whl >/dev/null 2>&1 || missing="$missing $tag"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Notify Slack
        continue-on-error: true
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          VERSION: ${{ steps.stock.outputs.version }}
          MISSING: ${{ steps.stock.outputs.missing }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$MISSING" ]; then
            headline=":snake: *docx-to-markdown $VERSION published to PyPI*"
            summary=":snake: docx-to-markdown $VERSION published to PyPI"
            detail=""
          else
            headline=":warning: *docx-to-markdown $VERSION published to PyPI without every platform*"
            summary=":warning: docx-to-markdown $VERSION published to PyPI without every platform"
            detail=$(printf '*Missing wheels*\n'; for t in $MISSING; do printf '• %s\n' "$t"; done)
          fi
          payload=$(jq -n \
            --arg summary "$summary" \
            --arg headline "$headline" \
            --arg version "$VERSION" \
            --arg detail "$detail" \
            --arg run_url "$RUN_URL" \
            --arg run_n "$RUN_NUMBER" \
            '{
              text: $summary,
              blocks: ([
                { type: "section", text: { type: "mrkdwn", text: ($headline + "\n<https://pypi.org/project/docx-to-markdown/" + $version + "/|docx-to-markdown==" + $version + ">") } }
              ] + (if $detail == "" then [] else [ { type: "section", text: { type: "mrkdwn", text: $detail } } ] end) + [
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run_url)|Run #\($run_n)>" } ] }
              ])
            }')
          curl -sSf --connect-timeout 10 --max-time 30 -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null

  notify-failure:
    # Nothing reached PyPI: no wheel built, or the upload itself failed.
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && needs.publish.result == 'failure'
    needs: [wheel, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: |
          payload=$(jq -n --arg run_url "$RUN_URL" --arg run_n "$RUN_NUMBER" --arg ref "$REF" '{
            text: ":x: docx-to-markdown \($ref) was NOT published to PyPI",
            blocks: [
              { type: "section", text: { type: "mrkdwn", text: ":x: *docx-to-markdown \($ref) was NOT published to PyPI*\nNo wheel built, or the upload failed. npm packages are unaffected." } },
              { type: "context", elements: [ { type: "mrkdwn", text: "<\($run_url)|Run #\($run_n)>" } ] }
            ]
          }')
          curl -sSf --connect-timeout 10 --max-time 30 -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
