name: Release downstream updates

# Site updates and the collaboration catalog for a verified release. Called after Verify
# release by the post-release workflow and by Recover release.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  sites:
    # A static name: GitHub appends the matrix value, so each job reads
    # "Site update (docx-editor.dev)" even when it never starts.
    name: Site update
    strategy:
      fail-fast: false
      matrix:
        repository: [docx-editor.dev, docx-to-markdown.com, docx-to-pdf.dev]
    runs-on: ubuntu-latest
    # The documentation sync waits for its own PR checks before it merges.
    timeout-minutes: 60
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: token
        with:
          app-id: ${{ secrets.RELEASE_PAL_APP_ID }}
          private-key: ${{ secrets.RELEASE_PAL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repository }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/collaboration
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Request the site update
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          # The site names its run after this ID, so the wait finds exactly this request. It
          # starts with the version, so after a cancel the wait follows only the same version.
          REQUEST_ID: ${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.repository }}
        run: |
          # A minute of margin for clock skew between the runner and GitHub.
          echo "since=$(date -u -d '-60 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "dispatched_at=$(date -u -d '-5 seconds' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          gh api "repos/$TARGET_REPOSITORY/dispatches" \
            -f event_type=upstream-release \
            -f "client_payload[version]=$RELEASE_VERSION" \
            -f "client_payload[request]=$REQUEST_ID"
      # A sent dispatch is not a finished update. This job passes only when the site's own
      # sync run passes. The site deploys in a separate workflow that this does not follow.
      - name: Wait for the site update to finish
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ github.repository_owner }}/${{ matrix.repository }}
          SINCE: ${{ steps.dispatch.outputs.since }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
          REQUEST_ID: ${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.repository }}
        run: node scripts/collaboration/site-update.mjs

  catalog:
    uses: ./.github/workflows/collaboration-catalog.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
      statuses: read
