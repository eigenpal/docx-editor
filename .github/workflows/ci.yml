name: CI

# Source checks, browser checks, package verification, and unit test shards run
# concurrently. The stable `test` gate requires every verification lane to pass.
#
# Pull requests skip the seeded collaboration scenarios and replays in
# benchmarks/collaboration-server. They are about half of the unit test time
# and rarely fail on a change that the rest of the suite passes. Every push to
# main runs the complete suite, and the Release workflow runs it again before
# it publishes, so a scenario failure stops the next release.
#
# Every job uses a standard GitHub-hosted runner, which is free for a public
# repository. Do not switch to larger runners (`*-cores` labels): those are
# billed even here. Hosted jobs share the organization's concurrency limit, so
# short checks share a job instead of each paying for its own runner.
#
# Caches are written only by pushes to main and pruned to the newest entry per
# prefix by `cache-maintenance`; pull requests only read them.
#
# Dependabot PRs are handled by dependabot-lockfile.yml (which refreshes
# bun.lock first and then runs the same checks inline), so we skip them
# here. GitHub treats skipped required checks as passing since 2022, so
# branch protection still works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: lint/test/build only read the repo.
permissions:
  contents: read

# New commits supersede older verification runs for the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: "github.actor != 'dependabot[bot]'"
    strategy:
      fail-fast: true
      matrix:
        # `lint` also runs the advisory and changeset checks, and `typecheck` the
        # informational Office.js report: each takes seconds, not a runner of its own.
        # The acceptance specs run one at a time, so they split into two jobs to keep
        # the browser lanes off the wall clock. `consumers` installs the packed
        # packages into fresh apps; `packages` checks the published artifacts and the
        # repository-wide checks that read the build.
        include:
          - check: lint
          - check: typecheck
          - check: browser
          - check: acceptance
            shard: 1/2
          - check: acceptance
            shard: 2/2
          - check: consumers
          - check: packages
    name: "${{ matrix.shard && format('{0} ({1})', matrix.check, matrix.shard) || matrix.check }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The consumer apps install from npm. A restored cache answers without the network.
      npm_config_prefer_offline: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: "${{ matrix.check == 'lint' && '0' || '1' }}"
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Restore npm cache
        if: "matrix.check == 'consumers' || matrix.check == 'packages'"
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-${{ matrix.check }}-${{ hashFiles('bun.lock') }}
          restore-keys: npm-${{ matrix.check }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
        if: "matrix.check == 'lint'"
      - name: Lane boundary compile check
        run: bun run check:lane-boundaries
        if: "matrix.check == 'lint'"
      - name: Example README shape check
        run: bun run check:example-readmes
        if: "matrix.check == 'lint'"
      - name: tsconfig lib floor check
        run: bun run check:tsconfig-lib-floor
        if: "matrix.check == 'lint'"
      - name: Format check
        run: bun run format:check
        if: "matrix.check == 'lint'"
      # Also a prepublish check. Running it here finds a missing header before the release PR.
      - name: License header check
        run: bun run check:license-headers
        if: "matrix.check == 'lint'"
      - name: Require a changeset when docs/api changed
        run: 'node scripts/check-api-changeset.mjs --base "origin/${{ github.base_ref }}"'
        if:
          "matrix.check == 'lint' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && !(startsWith(github.head_ref, 'changeset-release/') &&\n  github.event.pull_request.head.repo.full_name == github.repository)"
      - name: Shipped dependency advisories
        run: bun run check:shipped-advisories --sarif=shipped-advisories.sarif
        if: "matrix.check == 'lint'"
        id: advisories
      - name: Save advisory report
        if: "${{ !cancelled() && matrix.check == 'lint' && (steps.advisories.outcome == 'success' || steps.advisories.outcome == 'failure') }}"
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: shipped-advisories-sarif
          path: shipped-advisories.sarif
          if-no-files-found: ignore
          overwrite: true
      - name: Type check
        if: "matrix.check == 'typecheck'"
        run: bun run typecheck
      - name: i18n locale + typed-exports sync check
        if: "matrix.check == 'typecheck'"
        run: bun run i18n:validate
      - name: CLA logic tests
        if: "matrix.check == 'typecheck'"
        run: bash .github/cla/cla.test.sh
      # Informational: never fails the lane. The step summary says when no report was made.
      - name: Office.js editing report (informational)
        if: "matrix.check == 'typecheck'"
        id: office-js
        continue-on-error: true
        run: bun run --filter '@docx-editor.dev/editor-api' compat:report
      - name: Office.js report unavailable
        if: "matrix.check == 'typecheck' && steps.office-js.outcome == 'failure'"
        run: echo 'Office.js compatibility report unavailable. See job logs; no percentage was calculated.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full Office.js compatibility report
        if: "matrix.check == 'typecheck' && steps.office-js.outcome == 'success'"
        uses: actions/upload-artifact@v7
        with:
          name: office-js-compatibility
          path: packages/editor-api/compat/reports/
          retention-days: 30
      # Exercise the deployed source build without prebuilding the demo packages.
      # Package artifacts and declarations are verified separately in the build lane.
      - name: Demo deployment build
        if: "matrix.check == 'browser'"
        run: bun run build:preview
        env:
          # The same budget as the package build: the Vercel deployment runs this command
          # with Node's default heap.
          NODE_OPTIONS: '--max-old-space-size=2048'
      # Skips the slow apt step unless Chromium cannot start; see the script header.
      - name: Install Chromium for browser checks
        if: "matrix.check == 'browser' || matrix.check == 'acceptance'"
        run: bash scripts/install-ci-chromium.sh
      - name: Build the PDF server package for export checks
        if: "matrix.check == 'browser'"
        run: bun run build:pdf
      - name: Check table revision grouping and file exports in the editor
        if: "matrix.check == 'browser'"
        run: bunx playwright test --config e2e/editor-smoke.config.ts e2e/table-review-grouping.interaction.spec.ts e2e/file-export.interaction.spec.ts
      - name: Check Markdown page layout and review controls
        if: "matrix.check == 'browser'"
        run: "bun run --filter './examples/docx-to-markdown' check:preview"
      # Pixels, not styles: a dashed rule whose gradient sits on a solid ink fill has the
      # right `backgroundImage` and still paints as a solid line.
      - name: Check dashed and dotted borders paint with gaps
        if: "matrix.check == 'browser'"
        run: bun run check:border-patterns
      - name: Editor acceptance tests (React and Vue)
        if: "matrix.check == 'acceptance'"
        env:
          ACCEPTANCE_SHARD: ${{ matrix.shard }}
        run: bun run test:e2e:acceptance --shard "$ACCEPTANCE_SHARD"
      - name: Save editor browser failure evidence
        if: "failure() && (matrix.check == 'browser' || matrix.check == 'acceptance')"
        uses: actions/upload-artifact@v7
        with:
          name: editor-${{ matrix.check }}-${{ strategy.job-index }}-failures
          path: test-results/
          retention-days: 7
      - name: Build packages
        if: "matrix.check == 'consumers' || matrix.check == 'packages'"
        run: bun run build:packages
        env:
          # A budget, not a workaround. Anyone who builds these packages gets Node's
          # default heap, which is 2 GiB on an 8 GiB machine. Every package build peaks
          # near 1.2 GiB. If one outgrows this budget, it fails here instead of in a
          # caller that does not raise the heap.
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Third-party notices generate (gate)
        if: "matrix.check == 'consumers' || matrix.check == 'packages'"
        run: bun run notices:generate
      - name: Published-package consumer check
        if: "matrix.check == 'consumers'"
        run: SKIP_CONSUMER_INSTALL_BUILD=1 bun run check:consumer-install
      - name: PDF packed consumer check
        if: "matrix.check == 'packages'"
        run: "bun run --filter '@docx-editor.dev/docx-to-pdf' check:consumer"
      - name: Published-package artifact check
        if: "matrix.check == 'packages'"
        run: bun run check:package-artifacts
      - name: Shipped text-shaper check
        if: "matrix.check == 'packages'"
        run: bun run check:shipped-shaper
      - name: Check editor API consumers against published declarations
        if: "matrix.check == 'packages'"
        run: "bun run --filter '@docx-editor-examples/editor-api-consumers' typecheck:published"
      - name: Editor API public consumer workflows
        if: "matrix.check == 'packages'"
        run: "bun run --filter '@docx-editor-examples/editor-api-consumers' test:published"
      - name: Root and example type check
        if: "matrix.check == 'packages'"
        run: bun run typecheck:root
      - name: Example regression tests
        if: "matrix.check == 'packages'"
        run: bun test ./examples/shared/example-text.test.ts ./examples/vite/src/CollaborationDemo.test.tsx
      - name: Server agent lifecycle integration
        if: "matrix.check == 'packages'"
        run: "bun run --filter './examples/server-agent-review' test:lifecycle"
      # The PDF demo worker imports the built package, so its integration test can only run
      # where `dist/` exists. In the unit shards it skips itself with a message.
      - name: PDF demo worker integration
        if: "matrix.check == 'packages'"
        run: node --test examples/docx-to-pdf/server.node.test.mjs
      - name: PDF conversion function contract
        if: "matrix.check == 'packages'"
        run: node --test api/convert.node.test.mjs
      - name: API report check
        if: "matrix.check == 'packages'"
        run: bun run api:check
      - name: Parity gates
        if: "matrix.check == 'packages'"
        run: bun run check:parity
      - name: i18n per-locale bundle size check
        if: "matrix.check == 'packages'"
        run: bun run check:i18n-bundle-size
      - name: Fonts package manifest check
        if: "matrix.check == 'packages'"
        run: bun run check:fonts-manifest
      - name: Fonts package Google catalog check
        if: "matrix.check == 'packages'"
        run: bun run check:google-catalog
      - name: Word font width fidelity
        if: "matrix.check == 'packages'"
        timeout-minutes: 5
        run: bun run check:font-width-fidelity
      - name: Docs JSON generation (smoke test)
        if: "matrix.check == 'packages'"
        run: bun run docs:json
      - name: Documentation checks
        if: "matrix.check == 'packages'"
        run: bun run check:docs
      # Saved once per bun.lock; cache-maintenance removes the entries it replaces.
      - name: Save npm cache
        if: "github.event_name == 'push' && (matrix.check == 'consumers' || matrix.check == 'packages')"
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: npm-${{ matrix.check }}-${{ hashFiles('bun.lock') }}

  # Builds and packs the release candidate first, so the collaboration jobs start
  # as early as possible, then measures the package sizes.
  build:
    if: "github.actor != 'dependabot[bot]'"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_prefer_offline: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Restore npm cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-build-${{ hashFiles('bun.lock') }}
          restore-keys: npm-build-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build:packages
        env:
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Third-party notices generate (gate)
        run: bun run notices:generate
      - name: Collaboration policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_BRANCH: ${{ startsWith(github.head_ref, 'changeset-release/') }}
        run: |
          if [ "$RELEASE_BRANCH" = true ]; then
            bun run collaboration:check --release
          else
            bun run collaboration:check --base "$BASE_SHA"
          fi
      - name: Pack collaboration candidate
        run: node scripts/collaboration/cli.mjs pack
      - name: Upload collaboration candidate and build
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-build
          include-hidden-files: true
          path: |
            .cache/collaboration/publish/
            packages/*/dist/
            packages/*/THIRD_PARTY_NOTICES.md
          # Only downstream jobs of this run download it. Three days keeps
          # "Re-run failed jobs" working over a weekend.
          retention-days: 3
      - name: Package size report
        run: bun run check:package-size --out package-sizes.json
      - name: Upload package size report
        uses: actions/upload-artifact@v7
        with:
          name: package-sizes
          path: package-sizes.json
          overwrite: true
      - name: Save npm cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: npm-build-${{ hashFiles('bun.lock') }}

  # Every unit shard must split the suite with the same durations, or shards overlap
  # and skip files. This job reads the newest durations cache once and hands that
  # one copy to all shards. On a miss every shard splits without durations, which
  # is the same split everywhere.
  unit-plan:
    if: "github.actor != 'dependabot[bot]'"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      planned: ${{ steps.restore.outputs.cache-matched-key != '' }}
    steps:
      - name: Restore test durations
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: test-durations.json
          key: test-durations-${{ github.run_id }}
          restore-keys: test-durations-
      - name: Hand the durations to the shards
        if: steps.restore.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-plan
          path: test-durations.json
          if-no-files-found: error
          retention-days: 3

  unit:
    if: "github.actor != 'dependabot[bot]'"
    needs: unit-plan
    strategy:
      fail-fast: true
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Required when planned: a shard that lost the file would split differently.
      - name: Download test durations
        if: needs.unit-plan.outputs.planned == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-durations-plan
          path: node_modules/.cache/docx-editor
      # --balance splits by measured time. Without a durations file every shard
      # falls back to the same split without durations, so the shards still partition
      # the suite. --retry-failed runs a failed file once more: a pass on the retry is
      # reported as a FLAKY warning annotation instead of cancelling every shard.
      - name: Run unit test shard
        env:
          TEST_SHARD: '${{ matrix.shard }}'
          EVENT_NAME: '${{ github.event_name }}'
        run: |
          set -- --shard "$TEST_SHARD" --fail-fast --retry-failed --balance \
            --durations-out shard-durations.json
          if [ "$EVENT_NAME" = pull_request ]; then
            set -- "$@" \
              --exclude benchmarks/collaboration-server/collaboration-scenarios- \
              --exclude benchmarks/collaboration-server/collaboration-replays-
          fi
          bun run test "$@"
      - name: Upload shard durations
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-shard-${{ strategy.job-index }}
          path: shard-durations.json
          retention-days: 3

  # Pushes to main only. Merges the shards' fresh durations into one cache entry,
  # drops entries for deleted test files, and deletes every cache entry the new ones
  # replace, so the cache holds one durations file and one npm cache per job.
  cache-maintenance:
    if: "!cancelled() && github.event_name == 'push'"
    needs: [checks, build, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # delete replaced cache entries
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Download the plan and shard durations
        if: needs.unit.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          path: durations
      - name: Merge durations
        if: needs.unit.result == 'success'
        run: |
          set --
          [ -f durations/test-durations-plan/test-durations.json ] &&
            set -- durations/test-durations-plan/test-durations.json
          for shard in durations/test-durations-shard-*/shard-durations.json; do
            [ -f "$shard" ] && set -- "$@" "$shard"
          done
          node scripts/test/merge-durations.mjs --out test-durations.json "$@"
      - name: Save test durations
        if: needs.unit.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: test-durations.json
          key: test-durations-${{ github.run_id }}
      - name: Prune replaced cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep the newest entry for each prefix; delete the rest.
          for prefix in test-durations- npm-consumers- npm-packages- npm-build-; do
            gh cache list --ref refs/heads/main --key "$prefix" --sort created_at --order desc \
              --limit 100 --json id --jq '.[1:][].id' |
              while read -r id; do
                gh cache delete "$id"
              done
          done

  collaboration:
    if: github.actor != 'dependabot[bot]'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: collaboration-build
          path: .
      - name: Test published collaboration releases
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/collaboration/test.mjs --all --shard "$SHARD" --candidate .cache/collaboration/publish
      - name: Save compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-evidence-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .cache/collaboration/report-*.json
            .cache/collaboration/failure.json
          if-no-files-found: ignore
          retention-days: 14

  test:
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    needs: [checks, build, unit, collaboration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all verification lanes to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            test "$result" = success
          done

  package-size:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      actions: read # download the baseline artifact from a main run
      pull-requests: write # sticky size comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download current size report
        uses: actions/download-artifact@v8
        with:
          name: package-sizes

      # Compare against the PR's base commit, never an unrelated older main run.
      - name: Download size report for the PR base commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/package-size-baseline.mjs

      # The allow-label is read LIVE from the API, not from
      # `github.event.pull_request.labels`: a re-run reuses the frozen event
      # payload, so a label added after the gate failed would be invisible and
      # "label + re-run" could never pass. An API blip leaves `allow` empty,
      # which only makes the gate strict, never lax.
      - name: Compare against baseline (gate)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allow=""
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' \
            | grep -qx 'size-increase-expected'; then
            allow=1
          fi
          PACKAGE_SIZE_ALLOW_GROWTH="$allow" node scripts/check-package-size.mjs \
            --compare package-sizes.json \
            --baseline baseline/package-sizes.json --comment size-comment.md

      # `always()` so the comment still lands when the gate above fails — the
      # comment is where the failure explains itself. Fork PRs get a read-only
      # token and are skipped; they still see the table in the job summary.
      - name: Post sticky PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Author-filtered so a user comment that starts with the marker can
          # never be adopted (and overwritten) as the bot's sticky comment.
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- package-size-report -->"))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@size-comment.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@size-comment.md
          fi

  # Publishing SARIF needs a write token; all verification jobs stay read-only.
  # This informational upload cannot change the advisory gate result.
  security-report:
    name: Security report
    if: "${{ !cancelled() && github.actor != 'dependabot[bot]' }}"
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download advisory report
        uses: actions/download-artifact@v8
        with:
          name: shipped-advisories-sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shipped-advisories.sarif
          category: shipped-advisories
