name: CI

# `lint` and `test` run in parallel; `build needs: [lint, test]` so a
# package can never build before lint has passed (OpenSpec §4.3).
#
# Dependabot PRs are handled by dependabot-lockfile.yml (which refreshes
# bun.lock first and then runs the same checks inline), so we skip them
# here. GitHub treats skipped required checks as passing since 2022, so
# branch protection still works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: lint/test/build only read the repo.
permissions:
  contents: read

jobs:
  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lane boundary compile check
        # The only compile-level proof that store/layout/automation stay DOM-free:
        # each lane compiles against a lib with no `dom`. The import-edge half of
        # the lane DAG is a test (core-lane-imports.test.ts) and runs under `test`.
        run: bun run check:lane-boundaries

      - name: tsconfig lib floor check
        # Several packages map core to `../core/src`, so they type-check core's
        # sources and core's `lib` is their floor. Below it, `build:packages`
        # fails in the dts build with a raw TS2550 — this reports the cause, and
        # sits here so it lands before that build runs.
        run: bun run check:tsconfig-lib-floor

      - name: Format check
        run: bun run format:check

  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: i18n locale + typed-exports sync check
        run: bun run i18n:validate

      - name: Run tests
        run: bun run test

      # The React demo builds from LOCAL source, so this is the gate that a change to the
      # engine or the shipped stylesheet still produces a working app. `build:packages`
      # below does not catch it: a stylesheet that no CSS parser accepts passes typecheck,
      # the whole suite and the adapter-CSS check, and only fails when an app bundles it.
      - name: React demo app builds
        run: bun run check:app-build

      # The three Chromium gates that used to run here (`verify:a11y-tree`,
      # `verify:real-adapter-smoke`, `verify:real-adapter-gate`) drove the legacy editor
      # lane and went away with it — the scripts no longer exist, so the steps could only
      # fail. The browser specs that replaced them (`bun run test:e2e:editor`) still need a
      # Vue dev server this branch does not ship, so they are not wired in here yet.
      - name: CLA logic tests
        run: bash .github/cla/cla.test.sh

  # Advisories in the dependency closure we publish. Deliberately NOT `bun audit`:
  # that reads the whole workspace lock, so devDependencies and the demo apps in
  # examples/ would fail the build for CVEs no consumer can reach. See the header
  # of scripts/check-shipped-advisories.mjs.
  #
  # No `bun install` step on purpose. The script reads bun.lock and the package
  # manifests, so a checkout is the whole setup and the job finishes in seconds.
  # It is independent of lint/test, so `build` does not wait on it.
  shipped-advisories:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Shipped dependency advisories
        run: bun run check:shipped-advisories --sarif=shipped-advisories.sarif

      # `always()` so a failing gate still publishes what it found: the run log
      # is where a finding goes to be forgotten. `continue-on-error` because a
      # fork PR gets a read-only token and cannot upload — the gate above has
      # already passed or failed on its own, so a refused upload must not
      # change the job result.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: shipped-advisories.sarif
          category: shipped-advisories

  # A PR that changes the public API surface (docs/api/*.api.md) must carry a changeset,
  # or a removed export ships as an unversioned change. PRs only: on a push the changesets
  # are legitimately consumed, and the release PR (changeset-release/*) deletes them by
  # design. No `bun install` — git and node are the whole setup, same as shipped-advisories.
  api-changeset:
    # The changeset-release skip requires the SAME repo: head_ref is author-controlled, so
    # a fork branch named changeset-release/x must not buy its way past the gate.
    if: >-
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'changeset-release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changeset when docs/api changed
        run: node scripts/check-api-changeset.mjs --base "origin/${{ github.base_ref }}"

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Sizes of the exact artifacts `npm publish` ships (`npm pack --dry-run`
      # per published package). Uploaded as an artifact: main-branch runs are
      # the baseline the `package-size` job below diffs PRs against.
      - name: Package size report
        run: bun run check:package-size --out package-sizes.json

      # `overwrite` because artifact names are unique per RUN, not per attempt:
      # without it, "Re-run all jobs" 409s here and fails the build job.
      - name: Upload package size report
        uses: actions/upload-artifact@v4
        with:
          name: package-sizes
          path: package-sizes.json
          overwrite: true

      - name: API report check
        run: bun run api:check

      - name: Parity gates
        run: bun run check:parity

      # Fails when React/Vue adapter drift diverges from the pinned
      # baseline in scripts/feature-parity-baseline.json, in either
      # direction. Update the baseline with --update-baseline.
      - name: Feature parity gate
        run: bun run check:feature-parity

      # Same generator the release runs, here as a gate rather than for its
      # output: it fails when a newly bundled dependency ships no license text,
      # or when a tsup config stops emitting the metafile it reads. Catching
      # that on the PR beats discovering it mid-publish.
      - name: Third-party notices generate (gate)
        run: bun run notices:generate

      - name: Published-package artifact check
        run: bun run check:package-artifacts

      - name: Shipped text-shaper check
        run: bun run check:shipped-shaper

      - name: Published-package consumer check
        run: SKIP_CONSUMER_INSTALL_BUILD=1 bun run check:consumer-install

      - name: i18n per-locale bundle size check
        run: bun run check:i18n-bundle-size

      - name: Fonts package manifest check
        # Baked sha256 hashes in @docx-editor.dev/fonts must match the shipped font files.
        run: bun run check:fonts-manifest

      - name: Word font width fidelity
        run: bun run check:font-width-fidelity

      - name: Docs JSON generation (smoke test)
        # Not committed — `docs/json/` is gitignored. Run as a smoke test
        # so any breakage in the generator surfaces here instead of when
        # the docs site (`docx-editor-page`) tries to consume it.
        run: bun run docs:json

      - name: Docs MDX check
        # `docs/site/content/` is prose with no app in this repo to render it,
        # so a bare `{identifier}` compiles fine here and only explodes when
        # the docs site prerenders it. Same reasoning as the step above: catch
        # it on the PR, not in `docx-editor-page`'s build.
        run: bun run check:docs-mdx

      - name: Docs Vue ref check
        # A Vue template unwraps a ref only when the ref is a top-level binding.
        # Most composables return a plain object of refs, so a sample that drops
        # `.value` renders a control that never disables. Nothing type-checks
        # this prose, so the wrong sample would ship as written.
        run: bun run check:docs-vue-refs

  # Diffs the PR's published-package sizes against the latest successful main
  # run and keeps ONE sticky PR comment up to date. Fails on huge tarball
  # growth (thresholds in scripts/check-package-size.mjs) unless the PR
  # carries the `size-increase-expected` label. Separate from `build` so that
  # job keeps its read-only token; only this one gets `pull-requests: write`.
  package-size:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: build
    permissions:
      contents: read
      actions: read # download the baseline artifact from a main run
      pull-requests: write # sticky size comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download current size report
        uses: actions/download-artifact@v8
        with:
          name: package-sizes

      # Baseline = the `package-sizes` artifact from the newest successful
      # push run on main. Missing baseline (first run, expired artifact) is
      # not an error: the compare degrades to a report without deltas.
      - name: Download baseline size report from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `|| true` so a transient API error degrades to no-baseline instead
          # of failing the job (the shell runs with -e).
          run_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty' || true)
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n package-sizes -D baseline \
              || echo "Run $run_id has no package-sizes artifact yet; reporting without deltas."
          else
            echo "No successful main run found; reporting without deltas."
          fi

      # The allow-label is read LIVE from the API, not from
      # `github.event.pull_request.labels`: a re-run reuses the frozen event
      # payload, so a label added after the gate failed would be invisible and
      # "label + re-run" could never pass. An API blip leaves `allow` empty,
      # which only makes the gate strict, never lax.
      - name: Compare against baseline (gate)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allow=""
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' \
            | grep -qx 'size-increase-expected'; then
            allow=1
          fi
          PACKAGE_SIZE_ALLOW_GROWTH="$allow" node scripts/check-package-size.mjs \
            --compare package-sizes.json \
            --baseline baseline/package-sizes.json --comment size-comment.md

      # `always()` so the comment still lands when the gate above fails — the
      # comment is where the failure explains itself. Fork PRs get a read-only
      # token and are skipped; they still see the table in the job summary.
      - name: Post sticky PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Author-filtered so a user comment that starts with the marker can
          # never be adopted (and overwritten) as the bot's sticky comment.
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- package-size-report -->"))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@size-comment.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@size-comment.md
          fi
