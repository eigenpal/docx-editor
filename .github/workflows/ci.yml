name: CI

# `lint` and `test` run in parallel; `build needs: [lint, test]` so a
# package can never build before lint has passed (OpenSpec §4.3).
#
# Dependabot PRs are handled by dependabot-lockfile.yml (which refreshes
# bun.lock first and then runs the same checks inline), so we skip them
# here. GitHub treats skipped required checks as passing since 2022, so
# branch protection still works.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default GITHUB_TOKEN: lint/test/build only read the repo.
permissions:
  contents: read

jobs:
  lint:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

  test:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: i18n locale + typed-exports sync check
        run: bun run i18n:validate

      - name: Run tests
        run: bun run test

      # The React demo builds from LOCAL source, so this is the gate that a change to the
      # engine or the shipped stylesheet still produces a working app. `build:packages`
      # below does not catch it: a stylesheet that no CSS parser accepts passes typecheck,
      # the whole suite and the adapter-CSS check, and only fails when an app bundles it.
      - name: React demo app builds
        run: bun run check:app-build

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Chromium accessibility-tree gate
        run: bun run verify:a11y-tree

      - name: Chromium production-adapter load/paginate/save/reopen smoke
        run: bun run verify:real-adapter-smoke

      - name: Chromium production-adapter input-host gate
        run: bun run verify:real-adapter-gate

      - name: CLA logic tests
        run: bash .github/cla/cla.test.sh

  build:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: API report check
        run: bun run api:check

      # Same generator the release runs, here as a gate rather than for its
      # output: it fails when a newly bundled dependency ships no license text,
      # or when a tsup config stops emitting the metafile it reads. Catching
      # that on the PR beats discovering it mid-publish.
      - name: Third-party notices generate (gate)
        run: bun run notices:generate

      - name: Published-package artifact check
        run: bun run check:package-artifacts

      - name: Published-package consumer check
        run: SKIP_CONSUMER_INSTALL_BUILD=1 bun run check:consumer-install

      # Parity contract check is disabled while @docx-editor.dev/vue is WIP and
      # unpublished — it reads the Vue adapter's API Extractor snapshot, which is no
      # longer regenerated now that the package is off `build:packages`, so it can only
      # gate CI on an adapter that doesn't ship. Restore
      # `- name: Parity contract check / run: bun run check:parity-contract` when the
      # Vue package drops `private: true`.

      - name: i18n per-locale bundle size check
        run: bun run check:i18n-bundle-size

      - name: Fonts package manifest check
        # Baked sha256 hashes in @docx-editor.dev/fonts must match the shipped TTFs.
        run: bun run check:fonts-manifest

      - name: Docs JSON generation (smoke test)
        # Not committed — `docs/json/` is gitignored. Run as a smoke test
        # so any breakage in the generator surfaces here instead of when
        # the docs site (`docx-editor-page`) tries to consume it.
        run: bun run docs:json
