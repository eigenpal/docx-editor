name: CI verification lane

on:
  workflow_call:
    inputs:
      check:
        required: true
        type: string
      shard:
        default: '1/1'
        type: string

permissions:
  contents: read

jobs:
  lint:
    if: inputs.check == 'lint'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lane boundary compile check
        # The only compile-level proof that store/layout/automation stay DOM-free:
        # each lane compiles against a lib with no `dom`. The import-edge half of
        # the lane DAG is a test (core-lane-imports.test.ts) and runs under `test`.
        run: bun run check:lane-boundaries

      - name: tsconfig lib floor check
        # Several packages map core to `../core/src`, so they type-check core's
        # sources and core's `lib` is their floor. Below it, `build:packages`
        # fails in the dts build with a raw TS2550. This independent source
        # check reports the cause without waiting for package declarations.
        run: bun run check:tsconfig-lib-floor

      - name: Format check
        run: bun run format:check

  source-checks:
    if: inputs.check == 'typecheck' || inputs.check == 'unit' || inputs.check == 'browser'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        if: inputs.check == 'typecheck'
        run: bun run typecheck

      - name: i18n locale + typed-exports sync check
        if: inputs.check == 'typecheck'
        run: bun run i18n:validate

      - name: CLA logic tests
        if: inputs.check == 'typecheck'
        run: bash .github/cla/cla.test.sh

      - name: Run unit test shard
        if: inputs.check == 'unit'
        env:
          TEST_SHARD: ${{ inputs.shard }}
        run: bun run test --shard "$TEST_SHARD" --fail-fast

      # Build all four source demos before the Markdown browser check. The package
      # build cannot catch broken source aliases or CSS in these app bundles.
      - name: Demo apps build
        if: inputs.check == 'browser'
        run: bun run check:app-build

      - name: Install Chromium for Markdown preview checks
        if: inputs.check == 'browser'
        run: bunx playwright install --with-deps chromium

      - name: Check Markdown page layout and review controls
        if: inputs.check == 'browser'
        run: bun run --filter './examples/docx-to-markdown' check:preview

  build:
    if: inputs.check == 'build'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Check editor API consumers against published declarations
        run: bun run --filter '@docx-editor-examples/editor-api-consumers' typecheck:published

      # This integration test runs real Node workers against built package exports.
      # Keep it after build: the general Bun suite runs on a source-only checkout.
      - name: Setup Node for server agent integration
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Server agent lifecycle integration
        run: bun run --filter './examples/server-agent-review' test:lifecycle

      - name: Editor API public consumer workflows
        run: bun run --filter '@docx-editor-examples/editor-api-consumers' test:published

      # Sizes of the exact artifacts `npm publish` ships (`npm pack --dry-run`
      # per published package). Uploaded as an artifact: main-branch runs are
      # the baseline the `package-size` job below diffs PRs against.
      - name: Package size report
        run: bun run check:package-size --out package-sizes.json

      # `overwrite` because artifact names are unique per RUN, not per attempt:
      # without it, "Re-run all jobs" 409s here and fails the build job.
      - name: Upload package size report
        uses: actions/upload-artifact@v4
        with:
          name: package-sizes
          path: package-sizes.json
          overwrite: true

      - name: API report check
        run: bun run api:check

      - name: Parity gates
        run: bun run check:parity

      # Same generator the release runs, here as a gate rather than for its
      # output: it fails when a newly bundled dependency ships no license text,
      # or when a tsup config stops emitting the metafile it reads. Catching
      # that on the PR beats discovering it mid-publish.
      - name: Third-party notices generate (gate)
        run: bun run notices:generate

      - name: Published-package artifact check
        run: bun run check:package-artifacts

      - name: Shipped text-shaper check
        run: bun run check:shipped-shaper

      - name: Published-package consumer check
        run: SKIP_CONSUMER_INSTALL_BUILD=1 bun run check:consumer-install

      - name: i18n per-locale bundle size check
        run: bun run check:i18n-bundle-size

      - name: Fonts package manifest check
        # Baked sha256 hashes in @docx-editor.dev/fonts must match the shipped font files.
        run: bun run check:fonts-manifest

      - name: Fonts package Google catalog check
        # Offline. The generator owns the list of revisions a catalogued URL may be pinned
        # to; this is the only thing that enforces it. Without it a regenerated catalog
        # could point at a mutable branch tip and every unit test would still pass, because
        # a test can only assert the SHAPE of a URL, not which commits are allowed.
        run: bun run check:google-catalog

      - name: Word font width fidelity
        # The only step here that reaches the network: three Montserrat faces from
        # jsDelivr, hash-verified, retried three times on transport failure. Bounded so a
        # CDN that hangs fails this step instead of holding a runner for the workflow's
        # whole timeout.
        timeout-minutes: 5
        run: bun run check:font-width-fidelity

      - name: Docs JSON generation (smoke test)
        # Not committed — `docs/json/` is gitignored. Run as a smoke test
        # so any breakage in the generator surfaces here instead of when
        # the docs site (`docx-editor-page`) tries to consume it.
        run: bun run docs:json

      - name: Docs MDX check
        # `docs/site/content/` is prose with no app in this repo to render it,
        # so a bare `{identifier}` compiles fine here and only explodes when
        # the docs site prerenders it. Same reasoning as the step above: catch
        # it on the PR, not in `docx-editor-page`'s build.
        run: bun run check:docs-mdx

      - name: Docs chrome slot coverage
        # Keep the authored slot reference aligned with the public core union and
        # both adapter toolbar namespaces as those APIs grow.
        run: bun run check:docs-chrome-slots

      - name: Docs Vue ref check
        # A Vue template unwraps a ref only when the ref is a top-level binding.
        # Most composables return a plain object of refs, so a sample that drops
        # `.value` renders a control that never disables. Nothing type-checks
        # this prose, so the wrong sample would ship as written.
        run: bun run check:docs-vue-refs

  # Advisories in the dependency closure we publish. Deliberately NOT `bun audit`:
  # that reads the whole workspace lock, so devDependencies and the demo apps in
  # examples/ would fail the build for CVEs no consumer can reach. See the header
  # of scripts/check-shipped-advisories.mjs.
  #
  # No `bun install` step on purpose. The script reads bun.lock and the package
  # manifests, so a checkout is the whole setup and the job finishes in seconds.
  shipped-advisories:
    if: inputs.check == 'shipped-advisories'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Shipped dependency advisories
        run: bun run check:shipped-advisories --sarif=shipped-advisories.sarif

      # `always()` so a failing gate still publishes what it found: the run log
      # is where a finding goes to be forgotten. `continue-on-error` because a
      # fork PR gets a read-only token and cannot upload — the gate above has
      # already passed or failed on its own, so a refused upload must not
      # change the job result.
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: shipped-advisories.sarif
          category: shipped-advisories

  # A PR that changes the public API surface (docs/api/*.api.md) must carry a changeset,
  # or a removed export ships as an unversioned change. PRs only: on a push the changesets
  # are legitimately consumed, and the release PR (changeset-release/*) deletes them by
  # design. No `bun install` — git and node are the whole setup, same as shipped-advisories.
  api-changeset:
    # The changeset-release skip requires the SAME repo: head_ref is author-controlled, so
    # a fork branch named changeset-release/x must not buy its way past the gate.
    if: >-
      inputs.check == 'api-changeset' &&
      github.event_name == 'pull_request' &&
      github.actor != 'dependabot[bot]' &&
      !(startsWith(github.head_ref, 'changeset-release/') &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changeset when docs/api changed
        run: node scripts/check-api-changeset.mjs --base "origin/${{ github.base_ref }}"
