name: Release

# Two triggers, one flow across three jobs:
# 1. Every push to main → if there are pending changesets in `.changeset/`,
#    open or update a "chore: release" PR with the version bumps and CHANGELOG
#    entries applied. The PR sits there until a maintainer merges it.
# 2. When that PR is merged → the same flow runs again, sees no pending
#    changesets (they were drained by `changeset version`), and instead
#    publishes the new versions to npm.
#
# Job split and runner choice:
# - `mode` decides which path this run takes (pending changesets ⇒ PR-update,
#   none ⇒ publish).
# - `gate` runs the heavy prepublish checks (lint, format, typecheck, tests,
#   build, parity, notices) on Blacksmith for speed, publish path only, and
#   hands the built `dist/` + generated notices to `release` as an artifact.
# - `release` runs the changesets action and everything after it on a
#   GitHub-hosted runner: npm rejects provenance bundles from self-hosted
#   runners (E422 "Unsupported GitHub Actions runner environment"), and
#   Trusted Publishing always signs provenance. Blacksmith counts as
#   self-hosted, so the publish must not run there.
#
# The heavy gate only guards the PUBLISH path. On the PR-update path it is
# skipped: `changeset version` just rewrites versions + CHANGELOGs, needs no
# build, and the work is already validated by each contributing PR's own CI.
# Skipping keeps PR-update runs short so they finish before the next push to
# main supersedes them in the `release` concurrency group — otherwise slow
# runs queue and get cancelled, leaving the release PR stale.
#
# Manual workflow_dispatch is kept for the rare case of triggering a publish
# without a fresh push (e.g. recovering from a failed publish step).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Pending changesets ⇒ PR-update path (skip the heavy gate); none ⇒
  # publish path (run the full gate before publishing to npm). README.md /
  # config.json are not changesets.
  mode:
    name: Detect release mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publishing: ${{ steps.pending.outputs.publishing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Detect pending changesets
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "Pending changesets: $count"
          if [ "$count" -gt 0 ]; then
            echo "publishing=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing=true" >> "$GITHUB_OUTPUT"
          fi

  # The heavy prepublish gate, on Blacksmith for speed. Publish path only —
  # its `dist/` and third-party notices travel to the release job by artifact.
  gate:
    name: Prepublish gate
    needs: mode
    if: ${{ needs.mode.outputs.publishing == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Default job timeout is 6h; a hung step (e.g. an apt prompt) otherwise burns
    # a runner for hours. A healthy run finishes in well under 10 min.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build packages (publish reuses the dist/)
        run: bun run build:packages
        env:
          # tsup's dts worker (rollup-plugin-dts) loads the full TS program;
          # core's 67 entries OOM under the default 1.5 GB heap.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Parity prepublish gate
        run: bun run parity:prepublish

      # Emit `packages/<pkg>/THIRD_PARTY_NOTICES.md` from the build that is about
      # to be packed. The published bundles inline third-party source (the
      # private core package drags fast-xml-parser, fflate and prosemirror-* in
      # with it), and MIT/Apache-2.0 both require the copyright and permission
      # notice to travel with the copy — minified `dist/` carries neither.
      #
      # Must sit AFTER the last build step: the generator reads
      # `dist/metafile-*.json`. The files it writes are gitignored, so they
      # exist only inside this workflow run and reach `changeset publish`
      # through the artifact below and each package's `files` list. The step
      # hard-fails on a bundled dependency with no license text, which aborts
      # the run before anything reaches npm.
      - name: Generate third-party notices
        run: bun run notices:generate

      # Hand the exact build the gate validated to the release job. Both path
      # patterns share `packages/` as their common ancestor, so the artifact
      # keeps the `<pkg>/dist/...` layout and unpacks back into `packages/`.
      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: publish-dist
          path: |
            packages/*/dist
            packages/*/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 3

  # The changesets action and everything downstream of it. Must be a
  # GitHub-hosted runner — see the header comment.
  release:
    name: Release
    needs: [mode, gate]
    # Run on both paths: `gate` is skipped on the PR-update path by design,
    # so accept skipped as well as success.
    if: ${{ !cancelled() && needs.mode.result == 'success' && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Consumed by the notify-failure job to tell "the changesets step itself
      # failed" apart from "an earlier step failed".
      changesets_outcome: ${{ steps.changesets.outcome }}
    permissions:
      contents: write # push tags, create GitHub Releases
      pull-requests: write # changesets/action opens / updates the release PR
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      # Node 24 ships with npm 11.x; Trusted Publishing requires >=11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version
        run: |
          which npm
          npm --version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun install` runs `prepare` (husky), pointing core.hooksPath at the
      # repo's pre-commit hook (typecheck + parity + api:check + lint-staged).
      # That hook is for local dev — it must NOT gate the bot's automated
      # `chore: release` commit, where it both fails (api:check needs a build
      # this job doesn't run, and breaks on any pre-existing snapshot drift on
      # main) and is redundant: ci.yml already runs these on contributor PRs,
      # and the publish path runs them in the gate job. Neuter hooks for the job.
      - name: Disable git hooks for automated commits
        run: git config core.hooksPath /dev/null

      - name: Download publish artifacts
        if: ${{ needs.mode.outputs.publishing == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: publish-dist
          path: packages

      # The single step that does both PR-management and publishing.
      # - If `.changeset/*.md` are pending: opens / updates a "chore: release X.Y.Z" PR
      #   that runs `version` (drains changesets, bumps versions, writes CHANGELOG).
      #   `version-packages` also regenerates the Office.js conformance fixture:
      #   `compat/generated/docxeditor.shape.json` stamps editor-api's version, and a
      #   test asserts it equals a fresh regeneration — so a bump without this leaves
      #   the release PR red on a file only the bump changed.
      # - If no pending changesets and current package.json versions aren't on npm yet:
      #   runs `publish` and creates per-package git tags.
      - name: Release PR or Publish
        id: changesets
        uses: changesets/action@v2.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run version-packages
          publish-script: bunx changeset publish
          pr-title: 'chore: release'
          commit-message: 'chore: release'
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action creates per-package tags (e.g. `@docx-editor.dev/react@1.0.1`);
      # also create a single `vX.Y.Z` umbrella tag for Renovate/Dependabot/Releases.
      # The fixed group keeps every 1.x package in lockstep, so the umbrella
      # version = the version of any published package. The `published` gate
      # makes this idempotent: a re-run after publish flips published=false and
      # this step skips.
      - name: Create umbrella version tag (vX.Y.Z)
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version' <<<"$PUBLISHED_PACKAGES")
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"

      # Post-publish fan-out runs as the eigenpal-release-pal App rather than
      # the default GITHUB_TOKEN, so it can comment on this repo's PRs and
      # notify docx-editor.dev. (App permissions are managed in the org.)
      # continue-on-error on all three post-publish steps: the release has
      # already shipped to npm, so a transient failure here must NOT flip the
      # run to failed, which would suppress the success Slack and fire the
      # misleading "publish failed / partial state" alert keyed on
      # no-pending-changesets.
      - name: Mint release-pal App token
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        id: pal-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PAL_APP_ID }}
          private-key: ${{ secrets.RELEASE_PAL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: docx-editor,docx-editor.dev

      # Fan the release out to the work it shipped, all computed ONCE here at
      # publish time — nothing later rescans or resyncs:
      #   1. Comment "🚀 Released in vX.Y.Z" on every PR in the release.
      #   2. Comment the same on every issue those PRs closed.
      #   3. Stamp the roadmap board's "Shipped in" text field on each issue.
      # "What shipped in a tag" = squash-merge subjects ending in "(#N)"
      # between the previous umbrella tag and that tag, chore: release
      # commits skipped so the release PR doesn't comment on itself. Issues =
      # each PR's closing references (GitHub's own linkage) plus closing
      # keywords in commit messages. The first run creates the "Shipped in"
      # field and backfills it across every past v* tag — field only, no
      # comments on historical issues; after that each run touches only its
      # own release. To force a re-backfill, delete the field on the board.
      # PR/issue comments use the pal App token; board reads and writes use
      # the org-project PAT the label sync uses, and degrade to warnings so a
      # board problem never blocks the comments.
      - name: Comment on shipped PRs and closed issues, stamp the board
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pal-token.outputs.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          ORG: eigenpal
          PROJECT_NUMBER: 2
          FIELD_NAME: Shipped in
        run: |
          # `|| true` throughout: the shell runs with -e, so a grep no-match
          # (first-ever release, a tag with no closed issues) or a failed
          # best-effort API call would otherwise abort this step — which, via
          # the implicit success() gate, would skip the landing-notify
          # dispatch below.
          version=$(jq -r '.[0].version' <<<"$PUBLISHED_PACKAGES")
          OWNER="${REPO%%/*}"
          NAME="${REPO#*/}"
          # Includes v$version: the umbrella tag was created locally above.
          ALL_TAGS=$(git tag --list 'v*' --sort=v:refname)

          # Resolve the board and the "Shipped in" field once; create the
          # TEXT field on the first run. A missing field makes gh exit
          # non-zero (NOT_FOUND alongside the data), so tolerate the failure
          # and read what did resolve.
          BACKFILL=0
          PROJECT_JSON=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
            query($org: String!, $number: Int!, $field: String!) {
              organization(login: $org) {
                projectV2(number: $number) {
                  id
                  field(name: $field) {
                    ... on ProjectV2Field { id dataType }
                  }
                }
              }
            }' -f org="$ORG" -F number="$PROJECT_NUMBER" -f field="$FIELD_NAME" 2>/dev/null || true)
          PROJECT_ID=$(jq -r '.data.organization.projectV2.id // ""' <<<"$PROJECT_JSON")
          FIELD_ID=$(jq -r '.data.organization.projectV2.field.id // ""' <<<"$PROJECT_JSON")
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::Roadmap project did not resolve (PROJECT_TOKEN?); issues get comments only."
          elif [ -z "$FIELD_ID" ]; then
            FIELD_ID=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
              mutation($project: ID!, $name: String!) {
                createProjectV2Field(input: {projectId: $project, dataType: TEXT, name: $name}) {
                  projectV2Field { ... on ProjectV2Field { id } }
                }
              }' -f project="$PROJECT_ID" -f name="$FIELD_NAME" 2>/dev/null \
              | jq -r '.data.createProjectV2Field.projectV2Field.id // ""' || true)
            if [ -n "$FIELD_ID" ]; then
              echo "Created text field '$FIELD_NAME' — backfilling every past release."
              BACKFILL=1
            else
              echo "::warning::Could not create the '$FIELD_NAME' field; issues get comments only."
            fi
          fi

          # Comment on one issue and stamp its board item. The one read per
          # issue proves the number is an issue (a commit keyword can point
          # at a PR) and finds its board item; an off-board issue (no area
          # label) gets the comment but no field — board membership stays
          # owned by the label sync.
          sync_issue() {
            local n="$1" tag="$2" release_url="$3" do_comment="$4"
            local item_id=""
            if [ -n "$FIELD_ID" ]; then
              local issue_json
              if ! issue_json=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) {
                    issue(number: $number) {
                      projectItems(first: 50) { nodes { id project { id } } }
                    }
                  }
                }' -f owner="$OWNER" -f name="$NAME" -F number="$n" 2>/dev/null); then
                echo "#$n is not an issue; skipping."
                return 0
              fi
              item_id=$(jq -r --arg pid "$PROJECT_ID" '
                first(.data.repository.issue.projectItems.nodes[] | select(.project.id == $pid) | .id) // ""' \
                <<<"$issue_json")
            else
              # Board unavailable: still verify the number is an issue
              # before commenting on it.
              if ! gh api graphql -f query='
                query($owner: String!, $name: String!, $number: Int!) {
                  repository(owner: $owner, name: $name) { issue(number: $number) { id } }
                }' -f owner="$OWNER" -f name="$NAME" -F number="$n" > /dev/null 2>&1; then
                echo "#$n is not an issue; skipping."
                return 0
              fi
            fi
            if [ "$do_comment" -eq 1 ]; then
              gh issue comment "$n" --repo "$REPO" \
                --body "🚀 Released in [$tag]($release_url)" \
                || echo "Could not comment on issue #$n; continuing."
            fi
            if [ -n "$item_id" ]; then
              GH_TOKEN="$PROJECT_TOKEN" gh api graphql -f query='
                mutation($project: ID!, $item: ID!, $field: ID!, $text: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field, value: { text: $text }
                  }) { projectV2Item { id } }
                }' -f project="$PROJECT_ID" -f item="$item_id" \
                   -f field="$FIELD_ID" -f text="$tag" > /dev/null \
                && echo "Issue #$n: $FIELD_NAME = $tag." \
                || echo "::warning::Could not stamp issue #$n."
            elif [ -n "$FIELD_ID" ]; then
              echo "Issue #$n is off the board (no area label); field skipped."
            fi
          }

          # Comment every shipped PR and sync every issue those PRs closed,
          # for one umbrella tag. do_comment=0 on backfilled tags: historical
          # PRs and issues already got their comments when they shipped.
          sync_version() {
            local tag="$1" do_comment="$2"
            local prev
            prev=$(awk -v t="$tag" '$0 == t { print prev; exit } { prev = $0 }' <<<"$ALL_TAGS")
            if [ -z "$prev" ]; then
              echo "$tag is the first release tag (no lower bound); skipping."
              return 0
            fi
            local release_url="$SERVER_URL/$REPO/releases/tag/$tag"

            local prs
            prs=$(git log --format='%s' "$prev..$tag" \
              | grep -vE '^chore: release' \
              | grep -oE '\(#[0-9]+\)$' | tr -dc '0-9\n' | sort -u || true)
            echo "$tag shipped PRs: $(tr '\n' ' ' <<<"${prs:-none}")"

            local issues="" pr refs
            for pr in $prs; do
              if [ "$do_comment" -eq 1 ]; then
                gh pr comment "$pr" --repo "$REPO" \
                  --body "🚀 Released in [$tag]($release_url)" \
                  || echo "Could not comment on #$pr (closed / cross-fork?); continuing."
              fi
              refs=$(gh api graphql -f query='
                query($owner: String!, $name: String!, $pr: Int!) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $pr) {
                      closingIssuesReferences(first: 20) {
                        nodes { number repository { nameWithOwner } }
                      }
                    }
                  }
                }' -f owner="$OWNER" -f name="$NAME" -F pr="$pr" 2>/dev/null \
                | jq -r --arg repo "$REPO" \
                    '.data.repository.pullRequest.closingIssuesReferences.nodes[]
                     | select(.repository.nameWithOwner == $repo) | .number' || true)
              issues="$issues"$'\n'"$refs"
            done

            local commit_refs
            commit_refs=$(git log --format='%s %b' "$prev..$tag" \
              | grep -vE '^chore: release' \
              | grep -oiE '(fix(e[sd])?|close[sd]?|resolve[sd]?) #[0-9]+' \
              | grep -oE '[0-9]+' || true)
            issues=$(printf '%s\n%s\n' "$issues" "$commit_refs" \
              | grep -E '^[0-9]+$' | sort -un || true)
            if [ -z "$issues" ]; then
              echo "$tag: no closed issues."
              return 0
            fi
            echo "$tag closed issues: $(tr '\n' ' ' <<<"$issues")"

            local n
            for n in $issues; do
              sync_issue "$n" "$tag" "$release_url" "$do_comment"
            done
          }

          if [ "$BACKFILL" -eq 1 ]; then
            # Oldest first, so when an issue was re-fixed in a later release
            # the latest ship wins the field.
            for tag in $ALL_TAGS; do
              [ "$tag" = "v$version" ] && continue
              sync_version "$tag" 0
            done
          fi
          sync_version "v$version" 1

      # Tell the landing site a new version shipped. Its sync workflow opens an
      # auto-merging PR that bumps the pinned editor deps to this version.
      - name: Notify landing site of new release
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.pal-token.outputs.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version' <<<"$PUBLISHED_PACKAGES")
          gh api "repos/${{ github.repository_owner }}/docx-editor.dev/dispatches" \
            -f event_type=upstream-release \
            -f "client_payload[version]=$version"

      - name: Notify Slack — release succeeded
        if: ${{ steps.changesets.outputs.published == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # published-packages is JSON like:
          # [{"name":"@docx-editor.dev/react","version":"1.0.0"}, ...]
          version=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version')
          packages_md=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | "• <https://www.npmjs.com/package/\(.name)/v/\(.version)|\(.name)@\(.version)>"')
          # changesets/action with a fixed group creates per-package tags (e.g.
          # `@docx-editor.dev/react@1.0.0`), not a single `vX.Y.Z`. URL-encode
          # `@`/`/` so the link resolves on GitHub.
          release_tag=$(jq -rn --argjson pkgs "$PUBLISHED_PACKAGES" '$pkgs[0].name + "@" + $pkgs[0].version | @uri')
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$release_tag"
          payload=$(jq -n \
            --arg version "$version" \
            --arg actor "$ACTOR" \
            --arg run_n "$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg release "$release_url" \
            --arg packages "$packages_md" \
            '{
              text: ":white_check_mark: docx-editor \($version) released",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":white_check_mark: *docx-editor \($version) released*" } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: "*Version*\n<\($release)|\($version)>" },
                  { type: "mrkdwn", text: "*Triggered by*\n\($actor)" }
                ] },
                { type: "section", text: { type: "mrkdwn",
                  text: "*Packages*\n\($packages)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run_url)|Run #\($run_n)>" } ] }
              ]
            }')
          curl -sSf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null

  # Distinguish three failure modes when notifying Slack:
  #   - MODE=pre-release → the gate job failed, or a release-job step failed
  #     before the changesets step ever ran (install, checkout, artifact
  #     download).
  #   - MODE=release-pr  → changesets step failed AND pending changesets
  #     exist, so the run was trying to open/update the "chore: release" PR
  #     (no publish was attempted).
  #   - MODE=publish     → changesets step failed AND no pending changesets,
  #     so the run was trying to publish to npm and failed mid-publish.
  # Lives in its own job so a gate failure on Blacksmith still alerts — the
  # release job never starts in that case.
  notify-failure:
    name: Notify Slack — workflow failed
    needs: [mode, gate, release]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only curls the Slack webhook; needs no GITHUB_TOKEN access at all.
    permissions: {}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GATE_RESULT: ${{ needs.gate.result }}
          PUBLISHING: ${{ needs.mode.outputs.publishing }}
          CHANGESETS_OUTCOME: ${{ needs.release.outputs.changesets_outcome }}
        run: |
          if [ "$CHANGESETS_OUTCOME" != "failure" ]; then
            mode="pre-release"
            title=":x: docx-editor — pre-release step failed"
            detail="A step before the changesets action failed (gate: lint, format check, typecheck, tests, build, parity — or release-job setup). No release PR was updated and no publish was attempted. Check the run logs for the failing step."
          elif [ "$PUBLISHING" = "false" ]; then
            mode="release-pr"
            title=":warning: docx-editor — failed to update release PR"
            detail="The Release workflow could not assemble the \`chore: release\` PR (pending changesets exist). No publish was attempted. Likely cause: a malformed changeset file (wrong package name, bad frontmatter)."
          else
            mode="publish"
            title=":x: docx-editor — release publish failed"
            detail="No pending changesets, so the workflow tried to publish to npm and failed mid-publish. The package may be in a partial state — check the run logs."
          fi
          payload=$(jq -n \
            --arg title "$title" \
            --arg detail "$detail" \
            --arg mode "$mode" \
            --arg actor "$ACTOR" \
            --arg run_n "$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            '{
              text: $title,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "*\($title)*" } },
                { type: "section", text: { type: "mrkdwn", text: $detail } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: "*Mode*\n\($mode)" },
                  { type: "mrkdwn", text: "*Triggered by*\n\($actor)" },
                  { type: "mrkdwn", text: "*Run*\n<\($run_url)|#\($run_n)>" }
                ] }
              ]
            }')
          curl -sSf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
