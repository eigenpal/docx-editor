name: Release

# Two triggers, one flow across the mode, prepublish, and release jobs:
# 1. Every push to main → if there are pending changesets in `.changeset/`,
#    open or update a "chore: release" PR with the version bumps and CHANGELOG
#    entries applied. The PR sits there until a maintainer merges it.
# 2. When that PR is merged → the same flow runs again, sees no pending
#    changesets (they were drained by `changeset version`), and instead
#    publishes the new versions to npm.
# 3. Any later push without a changeset → every version is already on npm, so
#    the run is idle and every job after `mode` skips.
#
# Job split and runner choice:
# - `mode` decides which path this run takes (pending changesets ⇒ PR-update,
#   none ⇒ publish, none and nothing unpublished ⇒ idle).
# - `checks` runs lint, format, typecheck, tests, parity, license, and i18n
#   checks in a fail-fast matrix. `build` runs the package and
#   demo builds plus consumer validation in parallel, then hands the validated
#   artifact to `release`.
# - `release` runs the changesets action and creates the version tag on a
#   GitHub-hosted runner: npm rejects provenance bundles from self-hosted
#   runners (E422 "Unsupported GitHub Actions runner environment"), and
#   Trusted Publishing always signs provenance. Third-party runner services
#   count as self-hosted, so the publish must stay on a GitHub-hosted runner.
# - Every job uses a standard GitHub-hosted runner, which is free for a public
#   repository. Do not use larger runners (`*-cores` labels): those are billed.
#
# The checks and build jobs only guard the PUBLISH path. On the PR-update path
# they are skipped: `changeset version` just rewrites versions + CHANGELOGs, needs no
# build, and the work is already validated by each contributing PR's own CI.
# Skipping keeps PR-update runs short so they finish before the next push to
# main supersedes them in the `release` concurrency group — otherwise slow
# runs queue and get cancelled, leaving the release PR stale.
#
# Manual workflow_dispatch is kept for the rare case of triggering a publish
# without a fresh push (e.g. recovering from a failed publish step). Every stable
# job requires main, so a manual run on any other branch never updates the
# release PR or publishes; versions reach npm only from main.
#
# Canary channel. The nightly schedule, or a manual run with channel=canary,
# publishes the newest main commit that passed CI as a prerelease on the
# `canary` dist-tag, e.g. 2.35.0-canary.20261103032300.sha-b20ba9f. The base
# version is the one the pending changesets will release. `changeset version
# --snapshot` changes versions on the runner only: no commit, no git tag, no
# changelog, no GitHub Release, and `latest` never moves. The canary lives in
# this file because npm allows one Trusted Publisher per package, bound to the
# workflow filename. It runs in its own concurrency group, so a nightly run
# never cancels a queued release-PR update.
on:
  push:
    branches: [main]
  schedule:
    # Off the hour: GitHub delays or drops scheduled runs at :00 under load.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'release: update the release PR or publish to latest. canary: publish the newest green main commit to the canary tag.'
        type: choice
        options: [release, canary]
        default: release

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.channel == 'canary') && 'release-canary' || 'release' }}
  cancel-in-progress: false

jobs:
  # Pending changesets ⇒ PR-update path (skip checks/build); none ⇒
  # publish path (run the prepublish jobs before publishing to npm). README.md /
  # config.json are not changesets. No changesets and every public version
  # already on npm ⇒ idle: a merge without a changeset after a release has
  # nothing to publish, so every later job skips (scripts/release-mode.mjs).
  mode:
    name: Detect release mode
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # canary: find the newest main commit that passed CI
    env:
      RELEASE_CHANNEL: ${{ (github.event_name == 'schedule' || inputs.channel == 'canary') && 'canary' || 'release' }}
    outputs:
      # A canary run can only answer canary or idle. The script comes from the green
      # commit, so this also holds when that commit predates the canary channel.
      mode: ${{ ((github.event_name == 'schedule' || inputs.channel == 'canary') && steps.mode.outputs.mode != 'canary') && 'idle' || steps.mode.outputs.mode }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # A canary ships only a commit that main's own CI run passed, and only from the
      # canonical repository's main branch: never from a fork or a dispatch on a branch.
      - name: Find the newest main commit that passed CI
        id: commit
        if: ${{ env.RELEASE_CHANNEL == 'canary' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REPOSITORY" != "eigenpal/docx-editor" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "Canaries publish only from eigenpal/docx-editor main, not $REPOSITORY $REF" >&2
            exit 1
          fi
          sha=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "No main commit has a successful CI run" >&2
            exit 1
          fi
          echo "Newest main commit that passed CI: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Detect pending changesets and unpublished versions
        id: mode
        env:
          CANARY_COMMIT: ${{ steps.commit.outputs.sha }}
          # Canary only: reads main's changesets and the active Release runs.
          GH_TOKEN: ${{ env.RELEASE_CHANNEL == 'canary' && github.token || '' }}
        run: node scripts/release-mode.mjs

      # Every stable job requires main. A manual run on another branch, such as the
      # unmerged release PR branch, stops here: no release PR update, no publish.
      - name: Refuse stable releases outside main
        if: ${{ env.RELEASE_CHANNEL == 'release' && github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: echo "::warning::Stable releases run only from main. This run on $REF stops after mode detection."

  # Independent checks run concurrently. Publish path only — contributor PRs
  # already run the same checks, and the PR-update path only rewrites versions.
  checks:
    name: Prepublish ${{ matrix.label }}
    needs: mode
    if: ${{ github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'publish' }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: lint
            command: bun run lint
          - label: shipped dependency advisories
            command: bun run check:shipped-advisories
          - label: format
            command: bun run format:check
          - label: typecheck
            command: bun run typecheck
          - label: tests (1/6)
            command: bun run test --shard 1/6 --fail-fast --retry-failed
          - label: tests (2/6)
            command: bun run test --shard 2/6 --fail-fast --retry-failed
          - label: tests (3/6)
            command: bun run test --shard 3/6 --fail-fast --retry-failed
          - label: tests (4/6)
            command: bun run test --shard 4/6 --fail-fast --retry-failed
          - label: tests (5/6)
            command: bun run test --shard 5/6 --fail-fast --retry-failed
          - label: tests (6/6)
            command: bun run test --shard 6/6 --fail-fast --retry-failed
          - label: parity
            command: bun run check:parity
          - label: documentation
            command: bun run check:docs
          - label: license headers
            command: bun run check:license-headers
          - label: i18n
            command: bun run i18n:validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          # Downloading the binary takes seconds; caching it only fills the cache.
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Run check
        run: ${{ matrix.command }}

  # Build and artifact generation run alongside the checks. The release job
  # publishes exactly this output after all prepublish jobs pass.
  build:
    name: Prepublish build
    needs: mode
    if: ${{ github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          # Downloading the binary takes seconds; caching it only fills the cache.
          no-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      - name: Build packages (publish reuses the dist/)
        run: bun run build:packages

      - name: Check public API snapshots
        run: bun run api:check

      - name: Root and example type check
        run: bun run typecheck:root

      - name: Example regression tests
        run: bun test ./examples/shared/example-text.test.ts ./examples/vite/src/CollaborationDemo.test.tsx

      - name: Build demos and parity bundle
        run: bun run build

      - name: Consumer install check
        run: bun run check:consumer-install
        env:
          SKIP_CONSUMER_INSTALL_BUILD: '1'

      # Generate notices from the final build before packing release artifacts.
      - name: Generate third-party notices
        run: bun run notices:generate

      - name: Check published package artifacts
        run: bun run check:package-artifacts

      - name: PDF packed consumer check
        run: "bun run --filter '@docx-editor.dev/docx-to-pdf' check:consumer"

      - name: Check collaboration release decisions
        run: bun run collaboration:check --release

      - name: Pack collaboration release candidate
        run: node scripts/collaboration/cli.mjs pack

      - name: Upload collaboration release candidate
        uses: actions/upload-artifact@v7
        with:
          name: collaboration-candidate
          include-hidden-files: true
          path: .cache/collaboration/publish/
          if-no-files-found: error
          retention-days: 30

      # Hand the exact build the prepublish job validated to the release job. Both path
      # patterns share `packages/` as their common ancestor, so the artifact
      # keeps the `<pkg>/dist/...` layout and unpacks back into `packages/`.
      - name: Upload publish artifacts
        uses: actions/upload-artifact@v7
        with:
          name: publish-dist
          path: |
            packages/*/dist
            packages/*/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 3

  collaboration:
    name: Prepublish collaboration (${{ matrix.shard }})
    needs: [mode, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.mode.outputs.mode == 'publish' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: publish-dist
          path: packages
      - uses: actions/download-artifact@v8
        with:
          name: collaboration-candidate
          path: .cache/collaboration/publish
      - name: Test the complete release candidate
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/collaboration/test.mjs --all --allow-current --shard "$SHARD" --candidate .cache/collaboration/publish
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-collaboration-evidence-${{ strategy.job-index }}
          include-hidden-files: true
          path: |
            .cache/collaboration/report-*.json
            .cache/collaboration/failure.json
          if-no-files-found: ignore
          retention-days: 30

  # Publish packages and tag the release. Verification and updates run in
  # post-release.yml after this workflow completes. Publishing must use a
  # GitHub-hosted runner — see the header comment.
  release:
    name: Release
    needs: [mode, checks, build, collaboration]
    # PR updates accept skipped checks/build. Publication requires every gate
    # to succeed. The idle path has no work.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.mode.result == 'success' && ((needs.mode.outputs.mode == 'pending' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (needs.build.result == 'success' || needs.build.result == 'skipped')) || (needs.mode.outputs.mode == 'publish' && needs.checks.result == 'success' && needs.build.result == 'success' && needs.collaboration.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Consumed by the notify-failure job to tell "the changesets step itself
      # failed" apart from "an earlier step failed".
      changesets_outcome: ${{ steps.changesets.outcome }}
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write # push tags, create GitHub Releases
      pull-requests: write # changesets/action opens / updates the release PR
      id-token: write # OIDC for npm Trusted Publishing
      actions: write # dispatch the Python wheels workflow after npm publishes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          # Downloading the binary takes seconds; caching it only fills the cache.
          no-cache: true

      # Node 24 ships with npm 11.x; Trusted Publishing requires >=11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm version
        run: |
          which npm
          npm --version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      # `bun install` runs `prepare` (husky), pointing core.hooksPath at the
      # repo's pre-commit hook (typecheck + parity + api:check + lint-staged).
      # That hook is for local dev — it must NOT gate the bot's automated
      # `chore: release` commit, where it both fails (api:check needs a build
      # this job doesn't run, and breaks on any pre-existing snapshot drift on
      # main) and is redundant: ci.yml already runs these on contributor PRs,
      # and the publish path runs them in the prepublish jobs. Neuter hooks for the job.
      - name: Disable git hooks for automated commits
        run: git config core.hooksPath /dev/null

      - name: Download publish artifacts
        if: ${{ needs.mode.outputs.mode == 'publish' }}
        uses: actions/download-artifact@v8
        with:
          name: publish-dist
          path: packages

      - name: Download tested collaboration candidate
        if: ${{ needs.mode.outputs.mode == 'publish' }}
        uses: actions/download-artifact@v8
        with:
          name: collaboration-candidate
          path: .cache/collaboration/publish

      - name: Verify the publication payload without rebuilding
        if: ${{ needs.mode.outputs.mode == 'publish' }}
        run: node scripts/collaboration/cli.mjs verify --candidate .cache/collaboration/publish

      # The single step that does both PR-management and publishing.
      # - If `.changeset/*.md` are pending: opens / updates a "chore: release X.Y.Z" PR
      #   that runs `version` (drains changesets, bumps versions, writes CHANGELOG).
      #   `version-packages` also regenerates the Office.js conformance fixture:
      #   `compat/generated/docxeditor.shape.json` stamps editor-api's version, and a
      #   test asserts it equals a fresh regeneration — so a bump without this leaves
      #   the release PR red on a file only the bump changed.
      # - If no pending changesets and current package.json versions aren't on npm yet:
      #   runs `publish` and creates per-package git tags.
      - name: Release PR or Publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: bun run version-packages
          publish-script: bunx changeset publish
          pr-title: 'chore: release'
          commit-message: 'chore: release'
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action creates per-package tags (e.g. `@docx-editor.dev/react@1.0.1`);
      # also create a single `vX.Y.Z` umbrella tag for Renovate/Dependabot/Releases.
      # The fixed group keeps every 1.x package in lockstep, so the umbrella
      # version = the version of any published package. The `published` gate
      # makes this idempotent: a re-run after publish flips published=false and
      # this step skips.
      - name: Create umbrella version tag (vX.Y.Z)
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version' <<<"$PUBLISHED_PACKAGES")
          git tag -a "v$version" -m "Release v$version"
          git push origin "v$version"

      - name: Notify Slack — release succeeded
        continue-on-error: true
        if: ${{ steps.changesets.outputs.published == 'true' && env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # published-packages is JSON like:
          # [{"name":"@docx-editor.dev/react","version":"1.0.0"}, ...]
          version=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[0].version')
          packages_md=$(echo "$PUBLISHED_PACKAGES" | jq -r '.[] | "• <https://www.npmjs.com/package/\(.name)/v/\(.version)|\(.name)@\(.version)>"')
          # changesets/action with a fixed group creates per-package tags (e.g.
          # `@docx-editor.dev/react@1.0.0`), not a single `vX.Y.Z`. URL-encode
          # `@`/`/` so the link resolves on GitHub.
          release_tag=$(jq -rn --argjson pkgs "$PUBLISHED_PACKAGES" '$pkgs[0].name + "@" + $pkgs[0].version | @uri')
          release_url="${{ github.server_url }}/${{ github.repository }}/releases/tag/$release_tag"
          payload=$(jq -n \
            --arg version "$version" \
            --arg actor "$ACTOR" \
            --arg run_n "$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg release "$release_url" \
            --arg packages "$packages_md" \
            '{
              text: ":large_green_circle: docx-editor \($version) released",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":large_green_circle: *docx-editor \($version) released*" } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: "*Version*\n<\($release)|\($version)>" },
                  { type: "mrkdwn", text: "*Triggered by*\n\($actor)" }
                ] },
                { type: "section", text: { type: "mrkdwn",
                  text: "*Packages*\n\($packages)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run_url)|Run #\($run_n)>" } ] }
              ]
            }')
          curl -sSf --connect-timeout 10 --max-time 30 -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null

      # The Python package is versioned with the fixed group and built per platform, so
      # it publishes from its own workflow at the release tag. That run posts its own
      # Slack message with the PyPI link, or a failure notice.
      - name: Publish Python wheels
        if: ${{ steps.changesets.outputs.published == 'true' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[0].version' <<<"$PUBLISHED_PACKAGES")
          gh workflow run python-wheels.yml --ref "v$version" -f publish=true

  # Nightly prerelease on the `canary` dist-tag; see the header comment. Main's CI
  # already passed this commit, so the job repeats only the gates that depend on the
  # canary version itself: the build (telemetry embeds its version), the package
  # artifacts, and a consumer install of the exact tarballs with their pinned
  # internal ranges. Publishing needs a GitHub-hosted runner for provenance.
  canary:
    name: Canary
    needs: mode
    if: ${{ (github.event_name == 'schedule' || inputs.channel == 'canary') && needs.mode.result == 'success' && needs.mode.outputs.mode == 'canary' && needs.mode.outputs.commit != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # the stable-release gate lists active Release runs
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.mode.outputs.commit }}
          # `changeset version` reads the commit that added each changeset, as the
          # stable release job does.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
          # Downloading the binary takes seconds; caching it only fills the cache.
          no-cache: true

      # Node 24 ships with npm 11.x; Trusted Publishing requires >=11.5.1.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bash scripts/ci/install-dependencies.sh

      # Versions every public package <pending version>-canary.<UTC time>.sha-<commit>
      # and pins the internal peer and runtime ranges to that exact version.
      - name: Version the canary
        run: bun run changeset version --snapshot canary

      - name: Check the canary version
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          echo "Canary version: $version"
          case "$version" in
            *-canary.*.sha-*) ;;
            *) echo "Unexpected canary version: $version" >&2; exit 1 ;;
          esac

      - name: Build packages
        run: bun run build:packages

      - name: Generate third-party notices
        run: bun run notices:generate

      - name: Check published package artifacts
        run: bun run check:package-artifacts

      - name: Consumer install check
        run: bun run check:consumer-install
        env:
          SKIP_CONSUMER_INSTALL_BUILD: '1'

      # Installs docx-to-pdf with fonts-cjk, which the consumer install check does not cover.
      - name: PDF packed consumer check
        run: "bun run --filter '@docx-editor.dev/docx-to-pdf' check:consumer"

      # Checked again right before publishing: a release PR merged or a stable publish
      # started during this job skips the publish. See stableReleaseClear.
      - name: Confirm no stable release is active
        id: gate
        env:
          RELEASE_CHANNEL: canary-gate
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-mode.mjs

      # --tag canary keeps `latest` where it is. Canaries create no git tags. Canaries
      # post nothing to Slack; a failed canary shows only as a failed run in Actions.
      - name: Publish canary
        if: ${{ steps.gate.outputs.clear == 'true' }}
        run: bun run changeset publish --tag canary --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: 'true'

  # Distinguish three failure modes when notifying Slack:
  #   - MODE=pre-release → a prepublish job failed, or a release-job step failed
  #     before the changesets step ever ran (install, checkout, artifact
  #     download).
  #   - MODE=release-pr  → changesets step failed AND pending changesets
  #     exist, so the run was trying to open/update the "chore: release" PR
  #     (no publish was attempted).
  #   - MODE=publish     → changesets step failed AND no pending changesets,
  #     so the run was trying to publish to npm and failed mid-publish.
  # Lives in its own job so a prepublish failure still alerts — the
  # release job never starts in that case. Canary runs never post to Slack.
  notify-failure:
    name: Notify Slack — workflow failed
    needs: [mode, checks, build, release]
    if: ${{ failure() && github.event_name != 'schedule' && inputs.channel != 'canary' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Only curls the Slack webhook; needs no GITHUB_TOKEN access at all.
    permissions: {}
    steps:
      - name: Notify Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODE_RESULT: ${{ needs.mode.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_MODE: ${{ needs.mode.outputs.mode }}
          CHANGESETS_OUTCOME: ${{ needs.release.outputs.changesets_outcome }}
          PUBLISHED: ${{ needs.release.outputs.published }}
        run: |
          if [ "$PUBLISHED" = "true" ]; then
            mode="post-publish"
            title=":warning: docx-editor — release tagging failed after publication"
            detail="Packages were published, but release tagging failed. Check the original run and restore its version tag before using Recover release. Do not republish to repair a tag."
          elif [ "$MODE_RESULT" != "success" ]; then
            mode="release-mode"
            title=":x: docx-editor — release mode detection failed"
            detail="The Detect release mode job failed, so no release PR was updated and no publish was attempted. Check \`.changeset/config.json\` and the job log."
          elif [ "$CHANGESETS_OUTCOME" != "failure" ]; then
            mode="pre-release"
            title=":x: docx-editor — pre-release step failed"
            detail="A parallel prepublish check or build failed (checks: $CHECKS_RESULT; build: $BUILD_RESULT), or release-job setup failed. No release PR was updated and no publish was attempted. Check the run logs for the failing step."
          elif [ "$RELEASE_MODE" = "pending" ]; then
            mode="release-pr"
            title=":warning: docx-editor — failed to update release PR"
            detail="The Release workflow could not assemble the \`chore: release\` PR (pending changesets exist). No publish was attempted. Likely cause: a malformed changeset file (wrong package name, bad frontmatter)."
          else
            mode="publish"
            title=":x: docx-editor — release publish failed"
            detail="No pending changesets, so the workflow tried to publish to npm and failed mid-publish. The package may be in a partial state — check the run logs."
          fi
          payload=$(jq -n \
            --arg title "$title" \
            --arg detail "$detail" \
            --arg mode "$mode" \
            --arg actor "$ACTOR" \
            --arg run_n "$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            '{
              text: $title,
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "*\($title)*" } },
                { type: "section", text: { type: "mrkdwn", text: $detail } },
                { type: "section", fields: [
                  { type: "mrkdwn", text: "*Mode*\n\($mode)" },
                  { type: "mrkdwn", text: "*Triggered by*\n\($actor)" },
                  { type: "mrkdwn", text: "*Run*\n<\($run_url)|#\($run_n)>" }
                ] }
              ]
            }')
          curl -sSf -X POST -H 'Content-Type: application/json' -d "$payload" "$SLACK_WEBHOOK_URL" >/dev/null
