<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Export Validator</title><link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script></head>
<body>
<header class="masthead"><div><span class="eyebrow">LOCAL DEVELOPMENT</span><h1>PDF Export Validator<span class="dot"></span></h1></div><div class="header-actions"><a href="/api/triage" target="_blank">Agent report ↗</a><button id="refresh">Refresh</button><label class="button primary" for="upload">+ Add DOCX</label><input id="upload" type="file" accept=".docx" multiple hidden></div></header>
<div class="queue"><span id="worker">Connecting…</span><span id="inbox"></span></div>
<div id="notice" role="status" hidden></div>
<div class="workspace">
<aside><div class="filters"><label for="pair">COMPARE</label><select id="pair"></select><input id="search" type="search" placeholder="Find a document…" aria-label="Find a document"><select id="scope" aria-label="Evidence scope"><option value="original">Original documents · goal</option><option value="diagnostic">Shared-font diagnostics</option><option value="all">All evidence</option></select><div class="filter-row"><select id="filter" aria-label="Filter documents"><option value="all">All documents</option><option value="fail">Failing target</option><option value="mismatch">Page count differs</option><option value="unscored">Unscored / failed export</option><option value="fonts">Font substitutions</option><option value="pass">Passing target</option></select><select id="sort" aria-label="Sort documents"><option value="worst">Worst first</option><option value="early">Earliest drift</option><option value="name">Name</option></select></div><div id="counts"></div></div><nav id="documents" aria-label="Documents"></nav><div class="drop-hint">Drop DOCX files here or into the inbox.<br>One document at a time · 20 MiB per file</div></aside>
<main id="main"><div class="empty">Loading local evidence…</div></main>
</div>
<template id="detail"><section class="document-heading"><div><span class="eyebrow">DOCUMENT REVIEW</span><h2></h2><div class="links"></div></div><span class="verdict"></span></section><div class="metrics"></div><div class="finding"></div><div class="review-controls"><button id="first">First divergence</button><button id="worst">Worst page</button><label>Page <select id="page" aria-label="Page"></select></label><label class="check"><input id="show-diff" type="checkbox"> Show difference</label><select id="diff-mode" aria-label="Difference view"><option value="diff">Black / white</option><option value="overlay">Red overlay</option></select><label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="100">100%</option><option value="150">150%</option></select></label></div><div class="page-strip" aria-label="Pages in reading order"></div><div class="page-meta"></div><div class="preview-scroll"><div class="previews"></div></div><details class="evidence"><summary>Scoring, diagnostics &amp; top-to-bottom regions</summary><p>Pixel similarity = 100 − changed pixels (%), including blank margins, at the displayed DPI and threshold. Passing requires less than 1% error for the document and every page, matching page counts and dimensions, and valid run identity. It is not a certification of semantic fidelity. Font substitutions are flagged, never silently excluded.</p><p>The first divergence is the earliest page with ≥0.1% changed pixels, a missing page, or different dimensions. Inspect this page from the top and check the preceding page before attributing later drift. Text matching is heuristic.</p><div class="regions"></div><pre class="diagnostics"></pre></details></template>
</body></html>
