<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine Core Spike POC</title>
  </head>
  <body>
    <main id="app" data-poc-root class="poc-root">
      <header class="poc-header">
        <h1>Engine Core Spike POC</h1>
        <p class="poc-lede">Model-canonical paragraph editor with synchronized replica.</p>
      </header>
      <section class="poc-toolbar" aria-label="Editor controls">
        <button type="button" id="load-fixture">Load fixture</button>
        <button type="button" id="toggle-bold">Bold</button>
        <button type="button" id="toggle-italic">Italic</button>
        <button type="button" id="undo-edit">Undo</button>
        <button type="button" id="save-docx">Save</button>
      </section>
      <div id="poc-status" class="poc-status" aria-live="polite">Connection: idle; Save: idle</div>
      <div class="poc-panels">
        <section aria-labelledby="editable-heading">
          <h2 id="editable-heading">Editable</h2>
          <div id="editable-host" class="poc-surface"></div>
        </section>
        <section aria-labelledby="replica-heading">
          <h2 id="replica-heading">Replica</h2>
          <div id="replica-host" class="poc-surface poc-surface-readonly"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
