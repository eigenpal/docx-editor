[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docx-to-markdown"
dynamic = ["version"]
description = "Convert DOCX to Markdown with Word-faithful pages, headers, footers, comments, and tracked changes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["docx", "markdown", "converter", "word", "pagination"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
docx-to-markdown = "docx_to_markdown.cli:main"

[project.urls]
Homepage = "https://docx-editor.dev"
Documentation = "https://www.docx-editor.dev/docs/2.x/export/markdown"
Source = "https://github.com/eigenpal/docx-editor/tree/main/python/docx-to-markdown"
Issues = "https://github.com/eigenpal/docx-editor/issues"

[tool.hatch.version]
# One version for every published package: the wheel takes the converter's npm version,
# which `changeset version` bumps with the rest of the fixed group.
source = "regex"
path = "../../packages/docx-to-markdown/package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/docx_to_markdown"]
artifacts = ["src/docx_to_markdown/_vendor/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist carries no runtime; wheels are platform-specific and built per target.
exclude = ["src/docx_to_markdown/_vendor", "runtime", "package.json", "tsconfig.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Runtime validation of caller input keeps isinstance checks the types call redundant.
reportUnnecessaryIsInstance = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Explicit so a ruff upgrade cannot change what CI enforces.
select = ["E", "F", "I", "UP", "B", "SIM"]
