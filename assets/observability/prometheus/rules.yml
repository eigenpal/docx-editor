# Generated by assets/observability/generate.py. Do not edit by hand.
# Alerts on clear faults only. Set objectives and their alerts from your own traffic.
groups:
  - name: docx-editor
    rules:
      - alert: DocxTelemetryDroppingEvents
        expr: sum by (job, deployment_environment) (rate(docx_editor_telemetry_dropped_events_total[15m])) > 0
        for: 15m
        labels:
          severity: ticket
          service: docx-editor
          scope: editor
        annotations:
          summary: "The privacy check drops telemetry events; core and telemetry versions may differ ({{ $labels.job }})"
          runbook_url: https://docx-editor.dev/docs/2.x/telemetry/metrics
      - alert: DocxCollaborationServerDown
        expr: up{job="collaboration-server"} == 0
        for: 1m
        labels:
          severity: page
          service: docx-editor
          scope: server
        annotations:
          summary: "The collaboration server does not answer its /metrics scrape ({{ $labels.instance }})"
          runbook_url: https://docx-editor.dev/docs/2.x/telemetry/servers
      - alert: DocxCollaborationStoreFailing
        expr: sum by (job, instance) (rate(docx_editor_collab_room_store_duration_seconds_count{outcome!="success"}[10m])) > 0
        for: 5m
        labels:
          severity: page
          service: docx-editor
          scope: server
        annotations:
          summary: "Rooms fail to store, and edits may be lost on restart ({{ $labels.instance }})"
          runbook_url: https://docx-editor.dev/docs/2.x/telemetry/servers
